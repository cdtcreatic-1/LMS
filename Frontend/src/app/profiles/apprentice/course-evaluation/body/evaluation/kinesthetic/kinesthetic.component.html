<div *ngIf="questionSelected">
  <section class="title-icon">
    <h1>{{ questionSelected.question_content }}</h1>
    <div
      class="container-icon"
      (click)="handleReadQuestion(questionSelected.question_content)"
    >
      <ion-icon name="volume-medium-outline" class="icon"></ion-icon>
    </div>
  </section>

  <section class="container-list-option-answers">
    <!-- Lista de opciones (izquierda) -->
    <section class="box" data-drop-area="left" (dragover)="onDragOver($event)" (drop)="onDrop($event, 'left')">
      <div class="title-box">Lista de opciones</div>
      <section class="container-box-inter">
        <div
          class="container-check-text"
          *ngFor="let answer of questionSelected.SubmoduleAnswers"
          [attr.data-id]="answer.id_answer"
          draggable="true"
          (click)="handleClickSelecAnswer(answer.id_answer)"
          [ngClass]="{ 'input-selected': answer.isSelected }"
          (dragstart)="onDragStart($event, answer)"
          (dragend)="onDragEnd($event)"
        >
          <span>{{ answer.answers_content }}</span>
        </div>
      </section>
    </section>

    <section class="arrows">
      
      
      <!--<ion-icon
        name="chevron-forward-circle-outline"
        [ngClass]="{
          'disabled-icon': questionSelected.SubmoduleAnswers.length === 0
        }"
        (click)="handlePassAnswers()"
      ></ion-icon>
      <ion-icon
        name="chevron-back-circle-outline"
        [ngClass]="{
          'disabled-icon': dataAnswers.length === 0
        }"
        (click)="handleBackAnswers()"
      ></ion-icon>-->
    </section>

    <!-- Lista de respuestas correctas (derecha) -->
    <section class="box" data-drop-area="right" (dragover)="onDragOver($event)" (drop)="onDrop($event, 'right')">
      <div class="title-box">Lista de respuestas correctas</div>
      <section class="container-box-inter">
        <div
          *ngFor="let answer of dataAnswers"
          class="container-check-text"
          [attr.data-id]="answer.id_answer"
          (click)="handleClickSelecAnswer(answer.id_answer)"
          [ngClass]="{ 'input-selected': answer.isSelected }"
          draggable="true"
          (dragstart)="onDragStart($event, answer)"
          (dragend)="onDragEnd($event)"
        >
          <span>{{ answer.answers_content }}</span>
        </div>
      </section>
    </section>
  </section>

  <div class="clue">
    <h1>Arrastra tu respuesta y colócala en el área designada a la derecha, llamada "Lista de respuestas correctas"</h1>
  </div>

  <div class="container-buttons">
    <button class="fcdt-btn-white-p2" (click)="handleBack()">Atrás</button>
    <button class="fcdt-btn-p2" (click)="handleSubmit()">Siguiente</button>
  </div>

  <app-by-steps
    [numberByStep]="dataQuestion.length"
    [actualId]="1"
    [showNumber]="true"
  ></app-by-steps>
</div>
